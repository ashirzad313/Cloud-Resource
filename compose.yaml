services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://cloud_resource:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/cloud_resource?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloud_resource
      POSTGRES_DB: cloud_resource
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env first}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
